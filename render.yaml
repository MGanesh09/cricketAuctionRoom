services:
  - type: web
    name: cricket-auction-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRICKET_API_KEY
        sync: false

  - type: web
    name: cricket-auction-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cricket-auction-backend
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: cricket-auction-backend
          property: host
